apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-cm0
  labels:
    app: geometrie
    tier: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s

    scrape_configs:
      # Prometheus interroge l'API toutes les 5 s sur /metrics (modèle pull)
      - job_name: "api-ml"
        metrics_path: /metrics
        static_configs:
          - targets: ["api:8000"]
