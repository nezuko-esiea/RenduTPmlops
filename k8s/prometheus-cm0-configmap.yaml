apiVersion: v1
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s

    scrape_configs:
      # Prometheus interroge l'API toutes les 5 s sur /metrics (modèle pull)
      - job_name: "api-ml"
        metrics_path: /metrics
        static_configs:
          - targets: ["api:8000"]
kind: ConfigMap
metadata:
  annotations:
    use-subpath: "true"
  labels:
    io.kompose.service: prometheus
  name: prometheus-cm0
