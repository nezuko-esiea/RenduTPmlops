apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels:
    app: geometrie
    tier: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: geometrie
      tier: prometheus
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: geometrie
        tier: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.1
          ports:
            - containerPort: 9090
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: prometheus-cm0
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
              readOnly: true
      volumes:
        - name: prometheus-cm0
          configMap:
            name: prometheus-cm0
