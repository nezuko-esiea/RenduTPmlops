apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app: geometrie
    tier: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: geometrie
      tier: grafana
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: geometrie
        tier: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.4.0
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: grafana-provisioning
              mountPath: /etc/grafana/provisioning
              readOnly: true
            - name: grafana-cm1
              mountPath: /var/lib/grafana/dashboards
              readOnly: true
      volumes:
        - name: grafana-provisioning
          configMap:
            name: grafana-provisioning
            items:
              - key: datasource.yml
                path: datasources/datasource.yml
              - key: dashboards.yml
                path: dashboards/dashboards.yml
        - name: grafana-cm1
          configMap:
            name: grafana-cm1
