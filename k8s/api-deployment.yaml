apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app: geometrie
    tier: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: geometrie
      tier: api
  template:
    metadata:
      labels:
        app: geometrie
        tier: api
    spec:
      containers:
        - name: api
          # image construite par docker compose puis chargée dans minikube (minikube image load)
          image: rattrapagedevops-api:latest
          imagePullPolicy: Never
          env:
            - name: MLFLOW_TRACKING_URI
              value: http://mlflow:5000
            - name: MODEL_NAME
              value: geometrie-model
            - name: MODEL_STAGE
              value: Production
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "250m"
              memory: "768Mi"
            limits:
              memory: "1536Mi"
          # TensorFlow met une vingtaine de secondes à démarrer
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 3
